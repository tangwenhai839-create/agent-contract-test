name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal contract and fixture
      description: Remove secrets and provide the smallest reproducible example.
    validations:
      required: true
  - type: input
    attributes:
      label: Version and platform
    validations:
      required: true
